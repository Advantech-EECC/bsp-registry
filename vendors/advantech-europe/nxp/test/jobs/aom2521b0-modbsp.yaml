# LAVA Job Definition – Advantech aom2521b0 ModBSP Full QA Suite
# Board: aom2521b0
---
device_type: advantech-aom2521b0
job_name: "Advantech aom2521b0 ModBSP Full QA"
visibility: public
priority: medium

timeouts:
  job:
    minutes: 60
  action:
    minutes: 5
  connection:
    minutes: 2

metadata:
  source: https://github.com/Advantech-EECC/modular-bsp-test-definitions
  board: aom2521b0
  bsp: ModBSP
  cpu: Cortex-A53

tags: []

actions:

  - test:
      timeout:
        minutes: 50
      definitions:

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/context/context.yaml
          name: adv-context
          parameters:
            DISTRO_ID: Yocto
            DISTRO_VER: ""
            KERNEL_MIN_VER: 6.6
            CPU_MODEL: Cortex-A55

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/thermal/thermal.yaml
          name: adv-thermal
          parameters:
            THERMAL_COUNT: 1
            TZ0_DEV: thermal_zone0
            TZ0_MIN: 10
            TZ0_MAX: 70

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/cpu/cpu.yaml
          name: adv-cpu
          parameters:
            CPU_MODEL: Cortex-A55
            CPU_NPROC: "6"
            CPU_CSTATES: ""
            CPU_SCALING_MIN: 1200000
            CPU_SCALING_MAX: 1600000
            CPU_SCALING_GOVERNORS: "performance powersave"
            CPU_SUSPENSION_STATES: "freeze mem"

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/ram/ram.yaml
          name: adv-ram
          parameters:
            RAM_SLOT_COUNT: 1
            RAM_MIN_AVAIL: 5400
            RAM_SLOT0_SIZE: 6144
            RAM_SLOT0_SPEED: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/disk/disk.yaml
          name: adv-disk
          parameters:
            DISK_COUNT: 3
            DISK_ROOTFS_MOUNT: "/dev/mmcblk1p2:rw:SD /dev/mmcblk2p2:rw:MMC"
            DISK0_DEV: /dev/mmcblk1
            DISK0_TYPE: SD
            DISK0_SECTORS: 0
            DISK0_MIN_RS: 40
            DISK0_MIN_WS: 10
            DISK1_DEV: /dev/mmcblk2
            DISK1_TYPE: MMC
            DISK1_SECTORS: 30777344
            DISK1_MIN_RS: 100
            DISK1_MIN_WS: 50
            DISK2_DEV: /dev/sda
            DISK2_TYPE: USB
            DISK2_SECTORS: 0
            DISK2_MIN_RS: 100
            DISK2_MIN_WS: 50

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/eth/eth.yaml
          name: adv-eth
          parameters:
            ETH_COUNT: 2
            IPERF3_SERVER_IP: ""
            IPERF3_DURATION: 5
            ETH0_DEV: eth0
            ETH0_BUS: soc
            ETH0_BUS_ID: 30be0000
            ETH0_LINK: 1000
            ETH0_WOL_FEATURED: "y"
            ETH0_WOL_WAKEUP: "n"
            ETH0_MIN_TX_SPEED: 700
            ETH0_MIN_RX_SPEED: 700
            ETH1_DEV: eth1
            ETH1_BUS: soc
            ETH1_BUS_ID: 30bf0000
            ETH1_LINK: 1000
            ETH1_WOL_FEATURED: "y"
            ETH1_WOL_WAKEUP: "n"
            ETH1_MIN_TX_SPEED: 700
            ETH1_MIN_RX_SPEED: 700

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
