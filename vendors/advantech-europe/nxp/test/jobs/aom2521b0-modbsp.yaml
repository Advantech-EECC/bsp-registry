        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/pwm/pwm.yaml
          name: adv-pwm
          parameters:
            PWM_COUNT: 2
            PWM0_DEV: pwmchip0
            PWM0_BUS: soc
            PWM0_BUS_ID: 30670000
            PWM0_REFERENCE: ""
