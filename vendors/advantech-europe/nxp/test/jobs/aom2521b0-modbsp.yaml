            I2C1_REFERENCE: ""
            I2C2_DEV: /dev/i2c-2
            I2C2_CONTROLLER: 42530000.i2c
            I2C2_REFERENCE: ""
            I2C3_DEV: /dev/i2c-3
            I2C3_CONTROLLER: 42540000.i2c
            I2C3_REFERENCE: ""
            I2C4_DEV: /dev/i2c-4
            I2C4_CONTROLLER: 426b0000.i2c
            I2C4_REFERENCE: ""
            I2C6_DEV: /dev/i2c-6
