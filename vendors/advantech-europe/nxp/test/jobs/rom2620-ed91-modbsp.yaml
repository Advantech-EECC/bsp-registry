# LAVA Job Definition – Advantech ROM-2620 ED91 ModBSP Full QA Suite
# Board: ROM-2620-ED91 (NXP i.MX8MP, Cortex-A35)
---
device_type: advantech-rom2620 
job_name: "Advantech ROM-2620 ED91 ModBSP Full QA"
visibility: public
priority: medium

timeouts:
  job:
    minutes: 60
  action:
    minutes: 5
  connection:
    minutes: 2

metadata:
  source: https://github.com/Advantech-EECC/modular-bsp-test-definitions
  board: ROM-2620-ED91
  bsp: ModBSP
  soc: NXP i.MX8MP
  cpu: Cortex-A35

tags: []

actions:

  # ── Tests ───────────────────────────────────────────────────────────────────
  - test:
      timeout:
        minutes: 50
      definitions:

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/context/context.yaml
          name: adv-context
          parameters:
            DISTRO_ID: Yocto
            DISTRO_VER: ""
            KERNEL_MIN_VER: 6.6
            CPU_MODEL: Cortex-A35
            BIOS_DATE: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/thermal/thermal.yaml
          name: adv-thermal
          parameters:
            THERMAL_COUNT: 1
            TZ0_DEV: thermal_zone0
            TZ0_MIN: 10
            TZ0_MAX: 60

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/cpu/cpu.yaml
          name: adv-cpu
          parameters:
            CPU_MODEL: Cortex-A35
            CPU_NPROC: 2
            CPU_CSTATES: ""
            CPU_SCALING_MIN: 0
            CPU_SCALING_MAX: 0
            CPU_SCALING_GOVERNORS: ""
            CPU_SUSPENSION_STATES: freeze mem

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/ram/ram.yaml
          name: adv-ram
          parameters:
            RAM_SLOT_COUNT: 1
            RAM_MIN_AVAIL: 800
            RAM_SLOT0_SIZE: 1024
            RAM_SLOT0_SPEED: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/disk/disk.yaml
          name: adv-disk
          parameters:
            DISK_COUNT: 3
            DISK_ROOTFS_MOUNT: "/dev/mmcblk0p2:rw:MMC /dev/mmcblk2p2:rw:SD"
            DISK0_DEV: /dev/mmcblk0
            DISK0_TYPE: MMC
            DISK0_SECTORS: 30777344
            DISK0_MIN_RS: 100
            DISK0_MIN_WS: 40
            DISK1_DEV: /dev/mmcblk2
            DISK1_TYPE: SD
            DISK1_SECTORS: 0
            DISK1_MIN_RS: 10
            DISK1_MIN_WS: 4
            DISK2_DEV: /dev/sda
            DISK2_TYPE: USB
            DISK2_SECTORS: 0
            DISK2_MIN_RS: 10
            DISK2_MIN_WS: 4

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/eth/eth.yaml
          name: adv-eth
          parameters:
            ETH_COUNT: 1
            IPERF3_SERVER_IP: ""
            IPERF3_DURATION: 5
            ETH0_DEV: eth0
            ETH0_BUS: soc
            ETH0_BUS_ID: 29950000
            ETH0_LINK: 100
            ETH0_WOL_FEATURED: y
            ETH0_WOL_WAKEUP: n
            ETH0_MIN_TX_SPEED: 90
            ETH0_MIN_RX_SPEED: 90

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/uart/uart.yaml
          name: adv-uart
          parameters:
            UART_COUNT: 3
            UART0_DEV: /dev/ttyLP0
            UART0_BUS: soc
            UART0_BUS_ID: 29390000
            UART0_HWFC: n
            UART0_DEBUG_CONSOLE: n
            UART0_LOOPBACK_TEST: "9600:2W 921600:2W"
            UART0_REFERENCE: LPUART4-COMA
            UART1_DEV: /dev/ttyLP1
            UART1_BUS: soc
            UART1_BUS_ID: 293a0000
            UART1_HWFC: n
            UART1_DEBUG_CONSOLE: y
            UART1_LOOPBACK_TEST: skip
            UART1_REFERENCE: LPUART5-COMD
            UART2_DEV: /dev/ttyLP2
            UART2_BUS: soc
            UART2_BUS_ID: 29860000
            UART2_HWFC: n
            UART2_DEBUG_CONSOLE: n
            UART2_LOOPBACK_TEST: "9600:2W 921600:2W"
            UART2_REFERENCE: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/i2c/i2c.yaml
          name: adv-i2c
          parameters:
            I2C_COUNT: 2
            I2C0_DEV: /dev/i2c-0
            I2C0_CONTROLLER: i2c-rpmsg-adapter
            I2C0_REFERENCE: I2C_1101
            I2C1_DEV: /dev/i2c-6
            I2C1_CONTROLLER: 29840000.i2c
            I2C1_REFERENCE: I2C_1102 ↔ Lontium-LT9211

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/pwm/pwm.yaml
          name: adv-pwm
          parameters:
            PWM_COUNT: 1
            PWM0_DEV: pwmchip0
            PWM0_BUS: soc
            PWM0_BUS_ID: 2da80000
            PWM0_REFERENCE: ""
            PWM_BACKLIGHT_DEV: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/spi/spi.yaml
          name: adv-spi
          parameters:
            SPI_COUNT: 0

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/npu/npu.yaml
          name: adv-npu
          parameters:
            NPU_COUNT: 1

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/can/can.yaml
          name: adv-can
          parameters:
            CAN_COUNT: 0
            CAN_EXT_LOOPBACK: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/gpio/gpio.yaml
          name: adv-gpio
          parameters:
            GPIO_COUNT: 0
            GPIO_PINS: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/usb/usb.yaml
          name: adv-usb
          parameters:
            USB_DEV_COUNT: 2
            USB_OTG_ENABLED: 1
            USB_OTG_CONF: ""
            USB_DEV0_PORT: 1
            USB_DEV0_DRIVER: usb-storage
            USB_DEV0_SPEED: 480M
            USB_DEV1_PORT: 2
            USB_DEV1_DRIVER: usbhid
            USB_DEV1_SPEED: 1.5M

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/rtc/rtc.yaml
          name: adv-rtc
          parameters:
            RTC_COUNT: 1
            RTC0_DEV: /dev/rtc0
            RTC0_WAKEUP: enabled

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/watchdog/watchdog.yaml
          name: adv-watchdog
          parameters:
            WATCHDOG_COUNT: 1
            WATCHDOG0_DEV: /dev/watchdog0

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/tpm/tpm.yaml
          name: adv-tpm
          parameters:
            TPM_COUNT: 1

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/optee/optee.yaml
          name: adv-optee
          parameters:
            OPTEE_DEV: /dev/tee0

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/gpu/gpu.yaml
          name: adv-gpu
          parameters:
            GPU_COUNT: 1
            GPU_WAYLAND: weston
            GPU_VA_CODECS: ""
            GPU0_DRI_KMS_DEV: /dev/dri/card0
            GPU0_BACKLIGHT_DEV: /sys/class/backlight/bl
            GPU0_LVDS_MOD: ""
            GPU0_LVDS_DEV: ""
            GPU0_DRM_CONNECTOR: ""
            GPU0_DRM_CONNECTOR_ENCODER: ""
            GPU0_RESOLUTION: ""
            GPU0_REFRESH_RATE: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/audio/audio.yaml
          name: adv-audio
          parameters:
            AUDIO_PLAYBACK_COUNT: 0
            AUDIO_CAPTURE_COUNT: 0
