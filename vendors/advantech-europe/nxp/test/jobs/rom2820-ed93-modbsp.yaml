# LAVA Job Definition – Advantech ROM2820-ED93 ModBSP Full QA Suite
# Board: ROM2820-ED93
---
device_type: advantech-rom2820 
job_name: "Advantech ROM2820-ED93 ModBSP Full QA"
visibility: public
priority: medium

timeouts:
  job:
    minutes: 60
  action:
    minutes: 5
  connection:
    minutes: 2

metadata:
  source: https://github.com/Advantech-EECC/modular-bsp-test-definitions
  board: ROM2820-ED93
  bsp: ModBSP
  cpu: Cortex-A55

tags: []

actions:

  - test:
      timeout:
        minutes: 50
      definitions:

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/context/context.yaml
          name: adv-context
          parameters:
            DISTRO_ID: Yocto
            DISTRO_VER: ""
            KERNEL_MIN_VER: 6.6
            CPU_MODEL: Cortex-A55
            BIOS_DATE: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/thermal/thermal.yaml
          name: adv-thermal
          parameters:
            THERMAL_COUNT: 1
            TZ0_DEV: thermal_zone0
            TZ0_MIN: 10
            TZ0_MAX: 60

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/cpu/cpu.yaml
          name: adv-cpu
          parameters:
            CPU_MODEL: Cortex-A55
            CPU_NPROC: 2
            CPU_CSTATES: ""
            CPU_SCALING_MIN: 1200000
            CPU_SCALING_MAX: 1600000
            CPU_SCALING_GOVERNORS: "performance powersave"
            CPU_SUSPENSION_STATES: "freeze mem"

