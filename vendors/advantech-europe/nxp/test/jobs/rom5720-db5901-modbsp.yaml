device_type: advantech-rom5720
job_name: "Advantech ROM5720-DB5901 ModBSP Full QA"
visibility: public
priority: medium

timeouts:
  job:
    minutes: 60
  action:
    minutes: 5
  connection:
    minutes: 2

metadata:
  source: https://github.com/Advantech-EECC/modular-bsp-test-definitions
  board: ROM5720-DB5901
  bsp: ModBSP
  cpu: Cortex-A53

tags: []

