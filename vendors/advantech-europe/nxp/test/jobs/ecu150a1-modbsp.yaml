# LAVA Job Definition – Advantech ECU-150 ModBSP Full QA Suite
# Board: ECU-150
---
device_type: advantech-ecu-150 
job_name: "Advantech ECU-150 ModBSP Full QA"
visibility: public
priority: medium

timeouts:
  job:
    minutes: 60
  action:
    minutes: 5
  connection:
    minutes: 2

metadata:
  source: https://github.com/Advantech-EECC/modular-bsp-test-definitions
  board: ECU-150
  bsp: ModBSP
  cpu: Cortex-A53

tags: []

actions:

  - test:
      timeout:
        minutes: 50
      definitions:

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/context/context.yaml
          name: adv-context
          parameters:
            DISTRO_ID: Yocto
            DISTRO_VER: ""
            KERNEL_MIN_VER: 6.6
            CPU_MODEL: Cortex-A53
            BIOS_DATE: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/thermal/thermal.yaml
          name: adv-thermal
          parameters:
            THERMAL_COUNT: 1
            TZ0_DEV: thermal_zone0
            TZ0_MIN: 10
            TZ0_MAX: 60

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/cpu/cpu.yaml
          name: adv-cpu
          parameters:
            CPU_MODEL: Cortex-A53
            CPU_NPROC: 4
            CPU_CSTATES: ""
            CPU_SCALING_MIN: 800000
            CPU_SCALING_MAX: 1300000
            CPU_SCALING_GOVERNORS: "performance powersave"
            CPU_SUSPENSION_STATES: "freeze mem"

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/ram/ram.yaml
          name: adv-ram
          parameters:
            RAM_SLOT_COUNT: 1
            RAM_MIN_AVAIL: 3500
            RAM_SLOT0_SIZE: 4096
            RAM_SLOT0_SPEED: ""
            RAM_STABILITY_TIMEOUT: 600

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/disk/disk.yaml
          name: adv-disk
          parameters:
            DISK_COUNT: 3
            DISK_ROOTFS_MOUNT: "/dev/mmcblk1p2:rw:SD /dev/mmcblk0p2:rw:MMC"
            DISK0_DEV: /dev/mmcblk1
            DISK0_TYPE: SD
            DISK0_SECTORS: 0
            DISK0_MIN_RS: 20
            DISK0_MIN_WS: 10
            DISK1_DEV: /dev/mmcblk0
            DISK1_TYPE: MMC
            DISK1_SECTORS: 61071360
            DISK1_MIN_RS: 100
            DISK1_MIN_WS: 20
            DISK2_DEV: /dev/sda
            DISK2_TYPE: UNKNOWN
            DISK2_SECTORS: 0
            DISK2_MIN_RS: 5
            DISK2_MIN_WS: 5

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/eth/eth.yaml
          name: adv-eth
          parameters:
            ETH_COUNT: 2
            IPERF3_SERVER_IP: ""
            IPERF3_DURATION: 5
            ETH0_DEV: eth0
            ETH0_BUS: soc
            ETH0_BUS_ID: ""
            ETH0_LINK: 1000
            ETH0_WOL_FEATURED: "g"
            ETH0_WOL_WAKEUP: ""
            ETH0_MIN_TX_SPEED: 700
            ETH0_MIN_RX_SPEED: 700
            ETH1_DEV: eth1
            ETH1_BUS: pci
            ETH1_BUS_ID: "01:00.0"
            ETH1_LINK: 1000
            ETH1_WOL_FEATURED: "pumbg"
            ETH1_WOL_WAKEUP: "disabled"
            ETH1_MIN_TX_SPEED: 700
            ETH1_MIN_RX_SPEED: 700
            PING_IPV6_HOSTS: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/uart/uart.yaml
          name: adv-uart
          parameters:
            UART_COUNT: 4
            # UART1 / ttymxc0 – kernel debug console (console=ttymxc0)
            UART0_DEV: /dev/ttymxc0
            UART0_BUS: soc
            UART0_BUS_ID: 30860000
            UART0_HWFC: "n"            # DTS pinctrl_uart1 muxes TXD/RXD only – no RTS/CTS
            UART0_DEBUG_CONSOLE: "y"   # chosen: console=ttymxc0, stdout-path=&uart1
            UART0_LOOPBACK_TEST: skip
            UART0_REFERENCE: UART1-M2-COM2
            # UART2 / ttymxc1
            UART1_DEV: /dev/ttymxc1
            UART1_BUS: soc
            UART1_BUS_ID: 30890000
            UART1_HWFC: "n"
            UART1_DEBUG_CONSOLE: "n"
            # UART1_LOOPBACK_TEST: "9600:2W 921600:2W"
            UART1_LOOPBACK_TEST: skip
            UART1_REFERENCE: UART2-COM3
            # UART3 / ttymxc2 – RS-485 (rts-gpios, rs485-enabled-at-boot)
            UART2_DEV: /dev/ttymxc2
            UART2_BUS: soc
            UART2_BUS_ID: 30880000
            UART2_HWFC: "n"            # RS-485 half-duplex (RTS=direction), not classic crtscts
            UART2_DEBUG_CONSOLE: "n"   # console is ttymxc0, NOT this port
            # UART2_LOOPBACK_TEST: skip  # RS-485 half-duplex – 2W loopback not directly applicable
            UART2_LOOPBACK_TEST: skip
            UART2_REFERENCE: UART3-COM1
            # UART4 / ttymxc3 – RS-485
            UART3_DEV: /dev/ttymxc3
            UART3_BUS: soc
            UART3_BUS_ID: 30a60000
            UART3_HWFC: "n"
            UART3_DEBUG_CONSOLE: "n"
            # UART3_LOOPBACK_TEST: "9600:2W 921600:2W"
            UART3_LOOPBACK_TEST: skip
            UART3_REFERENCE: UART4-COM4

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/i2c/i2c.yaml
          name: adv-i2c
          parameters:
            I2C_COUNT: 4
            I2C0_DEV: /dev/i2c-0
            I2C0_CONTROLLER: 30a20000.i2c
            I2C0_REFERENCE: ""
            I2C1_DEV: /dev/i2c-1
            I2C1_CONTROLLER: 30a30000.i2c
            I2C1_REFERENCE: ""
            I2C2_DEV: /dev/i2c-2
            I2C2_CONTROLLER: 30a40000.i2c
            I2C2_REFERENCE: ""
            I2C3_DEV: /dev/i2c-4
            I2C3_CONTROLLER: i2c5_gpio
            I2C3_REFERENCE: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/spi/spi.yaml
          name: adv-spi
          parameters:
            SPI_COUNT: 0

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/npu/npu.yaml
          name: adv-npu
          parameters:
            NPU_COUNT: 1
            NPU0_DEV: /dev/galcore
            NPU0_BUS: soc
            NPU0_BUS_ID: 30380000
            NPU0_BUS_DEVICE_TYPE: clock-controller
            NPU0_BUS_NODE_NAME: "consumer:platform:38500000.vipsi"

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/gpio/gpio.yaml
          name: adv-gpio
          parameters:
            GPIO_COUNT: 0
            GPIO_PINS: ""

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/usb/usb.yaml
          name: adv-usb
          parameters:
            USB_DEV_COUNT: 1
            USB_DEV0_PORT: 001
            USB_DEV0_DRIVER: "usb-storage"
            USB_DEV0_SPEED: 480M

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/rtc/rtc.yaml
          name: adv-rtc
          parameters:
            RTC_COUNT: 2
            RTC0_DEV: /dev/rtc0
            RTC0_WAKEUP: enabled
            RTC1_DEV: /dev/rtc1
            RTC1_WAKEUP: disabled
            RTC_SUSPEND_DEV: /dev/rtc0
            RTC_SUSPEND_SLEEP_STATE: mem
            RTC_SUSPEND_WAKE_SLEEP_S: skip

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/watchdog/watchdog.yaml
          name: adv-watchdog
          parameters:
            WATCHDOG_COUNT: 1
            WATCHDOG0_DEV: /dev/watchdog0

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/tpm/tpm.yaml
          name: adv-tpm
          parameters:
            TPM_COUNT: 1

        - repository: https://github.com/Advantech-EECC/modular-bsp-test-definitions.git
          from: git
          branch: main
          path: automated/linux/optee/optee.yaml
          name: adv-optee
          parameters:
            OPTEE_DEV: /dev/tee0
