header:
  version: 14

# Community Rockchip BSP layer maintained by Trevor Woerner on
# git.yoctoproject.org.  It builds mainline U-Boot and linux-yocto and
# depends only on `core` and `meta-arm`, both of which are already provided
# by yocto/yocto.yaml and pinned by yocto/releases/scarthgap.yml.
#
# The RK3568 and RK3588(S) machine includes set ROCKCHIP_CLOSED_TPL = "1",
# which pulls the proprietary rkbin DDR initialiser, TF-A and OP-TEE blobs
# (recipes-bsp/rkbin, LICENSE = "Proprietary").  RK3399 has no such setting
# and builds entirely from open source.
repos:
  meta-rockchip:
    url: "https://git.yoctoproject.org/meta-rockchip"
    path: "layers/meta-rockchip"
    layers:
      .:

# Settings shared by every Rockchip build.
#
# No `distro` is set here: the community meta-rockchip layer does not require
# a vendor distro, so the registry release supplies `poky`.
target:
  - core-image-minimal
  - core-image-weston
  - core-image-full-cmdline
