# NVIDIA Jetson BSP registry extension.
# Included by bsp-registry.yml via the top-level ``include:`` directive.
# Contains all NVIDIA-specific vendor, device, and preset definitions.
# Release-level vendor_overrides that wire NVIDIA BSP layers into the
# per-Yocto-release entries remain in bsp-registry.yml because the registry
# merge mechanism concatenates the ``releases`` list rather than merging
# entries by slug, which would otherwise create duplicate release slugs.

registry:

  # =====================================
  # Vendors
  # =====================================

  vendors:

    - slug: nvidia
      name: "NVIDIA"
      description: "NVIDIA, accelerated computing and Jetson edge AI platforms (OE4T meta-tegra)."
      website: "https://www.nvidia.com/"
      includes:
        - vendors/nvidia/nvidia-common.yml

  # =====================================
  # Devices
  # =====================================

  devices:

    # --- NVIDIA Jetson Devices (OE4T meta-tegra) ---

    # Orin family (JetPack 5 & JetPack 6, scarthgap -> wrynose)
    - slug: jetson-agx-orin-devkit
      description: "NVIDIA Jetson AGX Orin Developer Kit"
      vendor: nvidia
      soc_vendor: nvidia
      architecture: arm64
      includes:
        - vendors/nvidia/machine/jetson-agx-orin-devkit.yml

    - slug: jetson-orin-nano-devkit
      description: "NVIDIA Jetson Orin Nano Developer Kit"
      vendor: nvidia
      soc_vendor: nvidia
      architecture: arm64
      includes:
        - vendors/nvidia/machine/jetson-orin-nano-devkit.yml

    - slug: jetson-orin-nano-devkit-nvme
      description: "NVIDIA Jetson Orin Nano Developer Kit (NVMe)"
      vendor: nvidia
      soc_vendor: nvidia
      architecture: arm64
      includes:
        - vendors/nvidia/machine/jetson-orin-nano-devkit-nvme.yml

    # Xavier family (JetPack 5 / L4T r35.x only, scarthgap)
    - slug: jetson-agx-xavier-devkit
      description: "NVIDIA Jetson AGX Xavier Developer Kit (JetPack 5 only)"
      vendor: nvidia
      soc_vendor: nvidia
      architecture: arm64
      includes:
        - vendors/nvidia/machine/jetson-agx-xavier-devkit.yml

    - slug: jetson-xavier-nx-devkit
      description: "NVIDIA Jetson Xavier NX Developer Kit (JetPack 5 only)"
      vendor: nvidia
      soc_vendor: nvidia
      architecture: arm64
      includes:
        - vendors/nvidia/machine/jetson-xavier-nx-devkit.yml

  # =====================================
  # Presets
  # =====================================

  bsp:

    # --- NVIDIA Jetson (OE4T meta-tegra / tegra-demo) ---

    # Orin family: JetPack 6 (L4T r36.x) across scarthgap -> wrynose
    - name: jetson-agx-orin-devkit
      description: "NVIDIA Jetson AGX Orin Developer Kit (tegra-demo)"
      device: jetson-agx-orin-devkit
      releases: [scarthgap, styhead, walnascar, whinlatter, wrynose]
      vendor_release: tegra
      features: []
      build:
        path: build/jetson-agx-orin-devkit

    - name: jetson-orin-nano-devkit
      description: "NVIDIA Jetson Orin Nano Developer Kit (tegra-demo)"
      device: jetson-orin-nano-devkit
      releases: [scarthgap, styhead, walnascar, whinlatter, wrynose]
      vendor_release: tegra
      features: []
      build:
        path: build/jetson-orin-nano-devkit

    - name: jetson-orin-nano-devkit-nvme
      description: "NVIDIA Jetson Orin Nano Developer Kit NVMe (tegra-demo)"
      device: jetson-orin-nano-devkit-nvme
      releases: [scarthgap, styhead, walnascar, whinlatter, wrynose]
      vendor_release: tegra
      features: []
      build:
        path: build/jetson-orin-nano-devkit-nvme

    # Xavier family: JetPack 5 (L4T r35.x), scarthgap only
    - name: jetson-agx-xavier-devkit
      description: "NVIDIA Jetson AGX Xavier Developer Kit (tegra-demo, JetPack 5)"
      device: jetson-agx-xavier-devkit
      releases: [scarthgap]
      vendor_release: tegra-jp5
      features: []
      build:
        path: build/jetson-agx-xavier-devkit

    - name: jetson-xavier-nx-devkit
      description: "NVIDIA Jetson Xavier NX Developer Kit (tegra-demo, JetPack 5)"
      device: jetson-xavier-nx-devkit
      releases: [scarthgap]
      vendor_release: tegra-jp5
      features: []
      build:
        path: build/jetson-xavier-nx-devkit
