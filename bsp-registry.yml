          - adv-mbsp-oenxp-walnascar-rom5721-1g-db5901.yaml

  # =====================================
  # Advantech ROM5721-2G-DB5901 (i.MX8MM)
  # =====================================

  - rom5721-2g-db5901:
      vendor: Advantech
      soc_vendor: NXP
      machine: imx8mmrom5721a1
      releases:
        mickledore-nxp-acl:
          - adv-bsp-oenxp-mickledore-rom5721-2g-db5901.yaml
        scarthgap-nxp-acl:
          - adv-bsp-oenxp-scarthgap-rom5721-2g-db5901.yaml
        scarthgap-nxp:
          - adv-mbsp-oenxp-scarthgap-rom5721-db5901.yaml
        styhead-nxp:
          - adv-mbsp-oenxp-styhead-rom5721-db5901.yaml
        walnascar-nxp:
          - adv-mbsp-oenxp-walnascar-rom5721-2g-db5901.yaml

  # =====================================
  # Advantech ROM5722-DB2510 (i.MX8M)
  # =====================================

  - rom5722-db2510:
      vendor: Advantech
      soc_vendor: NXP
      machine: rom5722-db2510
      releases:
        scarthgap-nxp:
          - adv-mbsp-oenxp-scarthgap-rom5722-db2510.yaml
        styhead-nxp:
          - adv-mbsp-oenxp-styhead-rom5722-db2510.yaml
        walnascar-nxp:
          - adv-mbsp-oenxp-walnascar-rom5722-db2510.yaml

  # =====================================
  # Advantech RSB3720 (i.MX8M Plus)
  # =====================================

  - rsb3720:
      vendor: Advantech
      soc_vendor: NXP
      machine: rsb3720
      releases:
        kirkstone-nxp:
          - adv-bsp-oenxp-kirkstone-rsb3720.yaml
        scarthgap-nxp:
          - adv-mbsp-oenxp-scarthgap-rsb3720.yaml
        styhead-nxp:
          - adv-mbsp-oenxp-styhead-rsb3720.yaml
        walnascar-nxp:
          - adv-mbsp-oenxp-walnascar-rsb3720.yaml

  - rsb3720-4g:
      vendor: Advantech
      soc_vendor: NXP
      machine: rsb3720-4g
      releases:
        walnascar-nxp:
          - adv-mbsp-oenxp-walnascar-rsb3720-4g.yaml

  - rsb3720-6g:
      vendor: Advantech
      soc_vendor: NXP
      machine: rsb3720-6g
      releases:
        walnascar-nxp:
          - adv-mbsp-oenxp-walnascar-rsb3720-6g.yaml

  # =====================================
  # Advantech RSB3810 (MediaTek Genio)
  # =====================================

  - rsb3810:
      vendor: Advantech
      soc_vendor: MediaTek
      machine: rsb3810
      releases:
        scarthgap-mtk:
          - adv-mbsp-oemtk-scarthgap-rsb3810.yaml

  # =====================================
  # MediaTek Genio 1200 EVK
  # =====================================

  - genio-1200-evk:
      vendor: MediaTek
      soc_vendor: MediaTek
      machine: genio-1200-evk
      releases:
        scarthgap-mtk:
          - vendors/mediatek/machine/genio-1200-evk.yml

  # =====================================
  # Advantech RSB3720 Isar (Debian)
  # =====================================

  - rsb3720-isar:
      vendor: Advantech
      soc_vendor: NXP
      machine: rsb3720
      releases:
        debian-trixie-isar:
          - adv-mbsp-isar-debian-trixie-rsb3720.yaml

  # =====================================
  # QEMU ARM64 (Poky/Yocto)
  # =====================================

  - qemuarm64:
      vendor: QEMU
      soc_vendor: QEMU
      machine: qemuarm64
      runtime_args: "--device=/dev/net/tun --cap-add=NET_ADMIN"
      releases:
        master-qemu:
          - yocto/master.yml
          - compilers/clang/master.yml
          - yocto/qemu/qemuarm64.yaml
        kirkstone-qemu:
          - yocto/kirkstone.yml
          - compilers/clang/kirkstone.yml
          - yocto/qemu/qemuarm64.yaml
        nanbield-qemu:
          - yocto/nanbield.yml
          - compilers/clang/nanbield.yml
          - yocto/qemu/qemuarm64.yaml
        mickledore-qemu:
          - yocto/mickledore.yml
          - compilers/clang/mickledore.yml
          - yocto/qemu/qemuarm64.yaml
        scarthgap-qemu:
          - yocto/scarthgap.yml
          - compilers/clang/scarthgap.yml
          - yocto/qemu/qemuarm64.yaml
        styhead-qemu:
          - yocto/styhead.yml
          - compilers/clang/styhead.yml
          - yocto/qemu/qemuarm64.yaml
        walnascar-qemu:
          - yocto/walnascar.yml
          - compilers/clang/walnascar.yml
          - yocto/qemu/qemuarm64.yaml
        whinlatter-qemu:
          - yocto/whinlatter.yml
          - compilers/clang/whinlatter.yml
          - yocto/qemu/qemuarm64.yaml

  # =====================================
  # QEMU x86-64 (Poky/Yocto)
  # =====================================

  - qemux86-64:
      vendor: QEMU
      soc_vendor: QEMU
      machine: qemux86-64
      runtime_args: "--device=/dev/net/tun --cap-add=NET_ADMIN"
      releases:
        walnascar-qemu:
          - yocto/walnascar.yml
          - compilers/clang/walnascar.yml
          - yocto/qemu/qemux86-64.yaml

  # =====================================
  # QEMU ARM64 (Isar)
  # =====================================

  - isar-qemuarm64:
      vendor: QEMU
      soc_vendor: QEMU
      machine: qemuarm64
      runtime_args: "--device=/dev/net/tun --cap-add=NET_ADMIN"
      copy:
        - isar/scripts/isar-runqemu.sh: build/
      releases:
        debian-trixie-isar:
          - isar/distro/debian-trixie.yaml
          - isar/qemu/qemuarm64.yaml
          - isar/isar.yaml
        ubuntu-noble-isar:
          - isar/distro/ubuntu-noble.yaml
        ubuntu-jammy-isar:
          - isar/distro/ubuntu-jammy.yaml
        ubuntu-focal-isar:
          - isar/distro/ubuntu-focal.yaml

  # =====================================
  # QEMU ARM (Isar)
  # =====================================

  - isar-qemuarm:
      vendor: QEMU
      soc_vendor: QEMU
      machine: qemuarm
      runtime_args: "--device=/dev/net/tun --cap-add=NET_ADMIN"
      releases:
        debian-trixie-isar:
          - isar/distro/debian-trixie.yaml
          - isar/qemu/qemuarm.yaml
          - isar/isar.yaml

  # =====================================
  # QEMU x86-64 (Isar)
  # =====================================

  - isar-qemux86-64:
      vendor: QEMU
      soc_vendor: QEMU
      machine: qemux86-64
      runtime_args: "-p 2222:2222 --device=/dev/net/tun --cap-add=NET_ADMIN"
      copy:
        - isar/scripts/isar-runqemu.sh: build/
      releases:
        debian-trixie-isar:
          - isar/distro/debian-trixie.yaml
          - isar/qemu/qemux86-64.yaml
          - isar/isar.yaml
        ubuntu-jammy-isar:
          - isar/distro/ubuntu-jammy.yaml
          - isar/qemu/qemux86-64.yaml
          - isar/isar.yaml
        ubuntu-noble-isar:
          - isar/distro/ubuntu-noble.yaml
          - isar/qemu/qemux86-64.yaml
          - isar/isar.yaml

releases:

  # NXP releases
  - kirkstone-nxp:
