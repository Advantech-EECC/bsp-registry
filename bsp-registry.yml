specification:
  version: "2.0"

# Vendor-specific registry fragments merged into this registry.
# Paths are relative to this file; list entries of the included files are
# appended to the corresponding sections defined below.
# Release-level vendor_overrides remain here because the registry merge mechanism
# concatenates the releases list rather than merging entries by slug.
include:
  - bsp-registry.isar.yaml
  - bsp-registry.qemu.yaml
  - bsp-registry.nxp.yaml
  - bsp-registry.mediatek.yaml
  - bsp-registry.qualcomm.yaml
  - bsp-registry.advantech.yaml
  - bsp-registry.advantech-aim-linux.yaml
  - bsp-registry.advantech-europe.yaml
  - bsp-registry.nvidia.yaml

# Optional top-level flash settings for deploying images to devices.
flash:
  tool: bmaptool                    # "bmaptool" (default) | "dd" | "uuu"
  image_patterns:                   # glob patterns, tried in order (first match wins)
    - "**/{build_target}-*.wic.zst" # expanded at runtime when --target is given (first priority)
    - "**/*.wic.bz2"                # most-compressed variant tried first
    - "**/*.wic.gz"
    - "**/*.wic.xz"
    - "**/*.wic.zst"
    - "**/*.wic"
  artifact_dirs:                    # subdirs under build_path to search
    - "build/tmp/deploy/images"
  extra_args: null                  # extra CLI args forwarded verbatim to the tool

deploy:
  provider: azure                                           # "azure" (default) or "aws"
  account_url: "https://modularbsp.blob.core.windows.net"   # Azure only; supports $ENV{} expansion
  container: bsp-registry-artifacts                         # Azure container name
  prefix: "{vendor}/{device}/{release}"                     # remote path prefix template
  yocto_cache:
    enabled: false          
    downloads: false        # include DL_DIR (default: true)
    sstate: false           # include SSTATE_DIR (default: true)
  patterns:                 # glob patterns for files to upload
    - "**/*.wic.gz"
    - "**/*.wic.bmap"
    - "**/*.wic"
    - "**/*.wic.zst"
    - "**/*.wic.bz2"
    - "**/*.tar.bz2"
    - "**/*.ext4"
    - "**/*.sdimg"
    - "**/*.img"
    - "**/*.bin"
    - "**/*.zip"
    - "**/bzImage"
    - "**/uImage"
    - "*-test-report.*"
  artifact_dirs:                                    # subdirs under build_path to search
    - build/tmp/deploy/images
    - build/tmp/deploy/sdk
    - test-results
  include_manifest: true                            # upload a JSON manifest of all artifacts
  include_build_manifest: true                      # upload a JSON manifest of the build environment

# Registry-level LAVA connection settings
lava:
  server: "$ENV{LAVA_SERVER}"                            # e.g. https://lava.example.com
  token: "$ENV{LAVA_TOKEN}"                              # LAVA API authentication token
  username: "$ENV{LAVA_USER}"                            # LAVA username (optional)
  artifact_server_url: "$ENV{LAVA_ARTIFACT_SERVER_URL}"  # Base URL where LAVA serves build artifacts (optional)
  wait_timeout: 3600                                     # max seconds to wait for a job (default: 1 h)
  poll_interval: 30                                      # polling interval in seconds

# Global environment variables for all builds (base layer – applied to every build)
# Use $ENV{VAR_NAME} syntax to reference system environment variables
environment:
  variables:
    - name: "GITCONFIG_FILE"
      value: "$ENV{HOME}/.gitconfig"
    - name: "DL_DIR"
      value: "$ENV{HOME}/data/cache/downloads"
    - name: "SSTATE_DIR"
      value: "$ENV{HOME}/data/cache/sstate"
  
containers:
  - ubuntu-20.04:
      file: Dockerfile.ubuntu
      image: "advantech/bsp-registry/ubuntu-20.04/kas:4.7"
      args:
        - name: "DISTRO" 
          value: "ubuntu:20.04"
        - name: "KAS_VERSION"
          value: "4.7"
  - ubuntu-24.04:
      file: Dockerfile.ubuntu-24
      image: "advantech/bsp-registry/ubuntu-24.04/kas:5.2"
      args:
        - name: "DISTRO" 
          value: "ubuntu:24.04"
        - name: "KAS_VERSION"
          value: "5.2"
  - ubuntu-22.04:
      file: Dockerfile.ubuntu
      image: "advantech/bsp-registry/ubuntu-22.04/kas:5.2"
      args:
        - name: "DISTRO" 
          value: "ubuntu:22.04"
        - name: "KAS_VERSION"
          value: "5.2"
  - ubuntu-22.04-csb:
      file: Dockerfile.ubuntu
      image: "advantech/bsp-registry/ubuntu-22.04/kas:5.2"
      args:
        - name: "DISTRO" 
          value: "ubuntu:22.04"
        - name: "KAS_VERSION"
          value: "5.2"
      volumes:
        - host: $ENV{CST_TOOL_PATH}
          container: "/opt/cst/"
  - debian-12:
      file: Dockerfile.debian
      image: "advantech/bsp-registry/debian-12/kas:5.2"
      args:
        - name: "KAS_VERSION"
          value: "5.2"
        - name: "DISTRO" 
          value: "debian-bookworm"
  - debian-13:
      file: Dockerfile.debian
      image: "advantech/bsp-registry/debian-13/kas:5.2"
      args:
        - name: "KAS_VERSION"
          value: "5.2"
        - name: "DISTRO" 
          value: "debian-trixie"
  - isar-debian-13:
      file: Dockerfile.isar.debian
      image: "advantech/bsp-registry/isar/debian-13/kas:5.2"
      runtime_args: "-p 2222:2222 --device=/dev/net/tun --cap-add=NET_ADMIN"
      privileged: true
      args:
        - name: "KAS_VERSION"
          value: "5.2"
        - name: "DISTRO" 
          value: "debian-trixie"

# Named environments: each entry bundles a container reference + variables.
# The special name "default" is used for any release that does not specify an environment.
# A release can override by setting its "environment:" field to a different name.
environments:
  default:
    container: ubuntu-22.04
  ubuntu-24.04:
    container: ubuntu-24.04
  ubuntu-22.04:
    container: ubuntu-22.04
  ubuntu-22.04-csb:
    container: ubuntu-22.04-csb
    variables:
      - name: "SIG_TOOL_PATH"
        value: "/opt/cst"  # Path inside the container where the signing tool is mounted
  ubuntu-20.04:
    container: ubuntu-20.04
  debian-13:
    container: debian-13
  isar-build-environment:
    container: isar-debian-13
    # Copy the QEMU run script into every Isar build directory
    copy:
      - isar/scripts/isar-runqemu.sh: build/
    variables:
      - name: "DL_DIR"
        value: "$ENV{HOME}/data/cache/isar/downloads"
      - name: "SSTATE_DIR"
        value: "$ENV{HOME}/data/cache/isar/sstate"

registry:

  # =====================================
  # Build System Frameworks
  # (e.g. Yocto, Isar)
  # =====================================
  
  frameworks:

    - slug: yocto
      description: | 
        Yocto Project build system
      vendor: "Yocto Project"
      includes:
        - common.yml
        - diskmon.yml
        - yocto/yocto.yaml

  # =====================================
  # Distributions
  # =====================================
  distro:
    
    - slug: poky
      description: "Poky (Yocto Project reference distro)"
      framework: yocto
      includes:
        - common.yml
        - yocto/distro/poky.yaml

    - slug: ros2
      description: "ROS 2 (Robot Operating System 2)"
      framework: yocto
      includes:
        - common.yml
        - yocto/distro/poky.yaml
        - features/ros2/ros2.yml

    - slug: poky-harden
      description: "Hardened Poky (Yocto Project reference distro)"
      framework: yocto
      includes:
        - common.yml
        - yocto/distro/harden.yaml

  # =====================================
  # Releases
  # =====================================
  releases:

    - slug: ros2-humble-scarthgap
      distro: ros2
      description: "ROS 2 Humble Hawksbill"
      yocto_version: "5.0"
      includes:      
        - features/ros2/humble.yml
        - yocto/releases/scarthgap.yml
        - compilers/clang/clang.yml
      vendor_overrides:
