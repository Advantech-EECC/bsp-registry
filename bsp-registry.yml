      vendor: Advantech
      soc_vendor: NXP
      machine: imx8mmrom5721a1
      releases:
        mickledore-nxp-acl:
          - adv-bsp-oenxp-mickledore-rom5721-1g-db5901.yaml
        scarthgap-nxp-acl:
          - adv-bsp-oenxp-scarthgap-rom5721-1g-db5901.yaml
        scarthgap-nxp:
          - adv-mbsp-oenxp-scarthgap-rom5721-db5901.yaml
        styhead-nxp:
          - adv-mbsp-oenxp-styhead-rom5721-db5901.yaml
