        styhead-nxp:
          - adv-mbsp-oenxp-styhead-rom2820-ed93.yaml
        walnascar-nxp:
          - adv-mbsp-oenxp-walnascar-rom2820-ed93.yaml

  # =====================================
  # Advantech ROM5720-DB5901 (i.MX8M)
