specification:
  version: "2.0"

environment:
  - name: "GITCONFIG_FILE"
    value: "$ENV{HOME}/.gitconfig"
  - name: "DL_DIR"
    value: "$ENV{HOME}/data/cache/downloads"
  - name: "SSTATE_DIR"
    value: "$ENV{HOME}/data/cache/sstate"

containers:
  - ubuntu-20.04:
      file: Dockerfile.ubuntu
      image: "advantech/bsp-registry/ubuntu-20.04/kas:4.7"
      args:
        - name: "DISTRO"
          value: "ubuntu:20.04"
        - name: "KAS_VERSION"
          value: "4.7"
  - ubuntu-22.04:
      file: Dockerfile.ubuntu
      image: "advantech/bsp-registry/ubuntu-22.04/kas:5.2"
      args:
        - name: "DISTRO"
          value: "ubuntu:22.04"
        - name: "KAS_VERSION"
          value: "5.2"
  - debian-13:
      file: Dockerfile.debian
      image: "advantech/bsp-registry/debian-13/kas:5.2"
      args:
        - name: "KAS_VERSION"
          value: "5.2"
        - name: "DISTRO"
          value: "debian-trixie"
  - isar-debian-13:
      file: Dockerfile.isar.debian
      image: "advantech/bsp-registry/isar/debian-13/kas:5.2"
      privileged: true
      args:
        - name: "KAS_VERSION"
          value: "5.2"
        - name: "DISTRO"
          value: "debian-trixie"

devices:

  # =====================================
  # Advantech RSB3730 (i.MX8MM)
  # =====================================

  - rsb3730:
      vendor: Advantech
      soc_vendor: NXP
      machine: imx8mmrsb3730a2
      releases:
        mickledore-nxp:
          - adv-bsp-oenxp-mickledore-rsb3730.yaml

  - rsb3730-4g:
      vendor: Advantech
      soc_vendor: NXP
      machine: imx8mmrsb3730a2
      releases:
        mickledore-nxp:
          - adv-bsp-oenxp-mickledore-rsb3730-4g.yaml

  # =====================================
  # Advantech AOM5521 (i.MX95)
  # =====================================

  - aom5521a1:
      vendor: Advantech
      soc_vendor: NXP
      machine: imx95aom5521a1
      releases:
        scarthgap-nxp:
          - adv-bsp-oenxp-scarthgap-aom5521a1.yaml
        walnascar-nxp:
          - adv-bsp-oenxp-walnascar-aom5521a1.yaml

  - aom5521a2:
      vendor: Advantech
      soc_vendor: NXP
      machine: imx95aom5521a2
      releases:
