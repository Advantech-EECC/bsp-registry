      compatible_with: [yocto]   # This feature is only compatible with the Yocto framework
      includes:
        - yocto/features/udev.yaml

    - slug: usrmerge
      description: "Enable usrmerge support in the Yocto image"
      compatible_with: [yocto]   # This feature is only compatible with the Yocto framework
      includes:
        - yocto/features/usrmerge.yaml

    - slug: rauc
