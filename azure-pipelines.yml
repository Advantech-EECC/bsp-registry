#
# azure-pipelines.yml
#
# Builds ALL BSP variants defined in the registry using a dynamic matrix.
# Uses bsp-registry-tools to discover and build variants.
#

pool:
  name: aeu.de

trigger: none

variables:
  # Pinned bsp-registry-tools release. Bump deliberately: the matrix
  # generator parses the human-readable 'bsp list' output.
  BSP_TOOLS_VERSION: "2.2.4"

jobs:
  # -----------------------------------------------------------------------------
  # Job 1: Generate the build matrix by listing all BSPs
  # -----------------------------------------------------------------------------
  - job: GenerateMatrix
    displayName: "Discover BSP Variants"
    timeoutInMinutes: 10
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
        displayName: 'Checkout repository'

      - script: |
          set -e
          # Use a venv: 'pip install --user' is rejected on PEP 668
          # (externally-managed) system Pythons such as Debian 12 / Ubuntu 24.04.
          VENV="$(Agent.TempDirectory)/bsp-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install "bsp-registry-tools==$(BSP_TOOLS_VERSION)"
          echo "##vso[task.prependpath]$VENV/bin"
          "$VENV/bin/bsp" --version
        displayName: "Install bsp-registry-tools and expose bsp on PATH"

      - task: PythonScript@0
        displayName: 'Generate Build Matrix'
        inputs:
          scriptSource: 'inline'
          script: |
            import subprocess
            import json
            import re
            import sys

            print("Listing available BSPs...")
            try:
                # Run 'bsp --no-color --local list' to get the list of variants.
                # --local must match the build job, otherwise the matrix is
                # generated from the remote (main) registry instead of the
                # registry in this checkout.
                result = subprocess.run(
                    ['bsp', '--no-color', '--local', 'list'],
                    capture_output=True,
                    text=True,
                    check=True
                )

                output = result.stdout
                bsp_list = []

                # Parse output lines formatted like "- bsp-name: Description"
                for line in output.splitlines():
                    line = line.strip()
                    if line.startswith("- "):
                        # Extract name between "- " and ":"
                        match = re.match(r'- ([^:]+):', line)
                        if match:
                            bsp_name = match.group(1).strip()
                            bsp_list.append(bsp_name)

                print(f"Found {len(bsp_list)} variants.")

                # An empty matrix would skip every build and still report
                # success (e.g. if the 'bsp list' output format changes).
                if not bsp_list:
                    print("##vso[task.logissue type=error]No BSP presets found in 'bsp list' output:")
                    print(output)
                    sys.exit(1)

                # Construct Azure DevOps matrix dictionary
                # Format: { "JobNameSuffix": { "VAR_NAME": "value" }, ... }
                matrix = {}
                for bsp in bsp_list:
                    # Create a safe job name (alphanumeric only)
                    safe_name = re.sub(r'[^a-zA-Z0-9]', '_', bsp)
                    matrix[safe_name] = { "BSP_NAME": bsp }

                # Convert to JSON
                matrix_json = json.dumps(matrix)

                # Set the output variable 'matrix' for the next job
                print(f"##vso[task.setvariable variable=matrix;isOutput=true]{matrix_json}")

            except subprocess.CalledProcessError as e:
                print(f"Error running bsp list: {e.stderr}")
                sys.exit(1)
        name: 'generator'

  # -----------------------------------------------------------------------------
  # Job 2: Build each BSP variant in parallel
  # -----------------------------------------------------------------------------
  - job: BuildBSP
    displayName: "Build BSP"
    dependsOn: GenerateMatrix
    # Use the dynamic matrix output from the generator job
    strategy:
      matrix: $[ dependencies.GenerateMatrix.outputs['generator.matrix'] ]

    timeoutInMinutes: 500 # Adjust based on typical Yocto build times

    # Download and sstate cache locations are defined by the registry
    # (environment.variables in bsp-registry.yml): $HOME/data/cache/... on
    # the agent, shared between builds.

    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
        displayName: 'Checkout repository'

      - script: |
          echo "Building Variant: $(BSP_NAME)"
        displayName: 'Display Variant Info'

      - script: |
          set -e
          # Use a venv: 'pip install --user' is rejected on PEP 668
          # (externally-managed) system Pythons such as Debian 12 / Ubuntu 24.04.
          VENV="$(Agent.TempDirectory)/bsp-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install "bsp-registry-tools==$(BSP_TOOLS_VERSION)"
          echo "##vso[task.prependpath]$VENV/bin"
          "$VENV/bin/bsp" --version
        displayName: "Install bsp-registry-tools and expose bsp on PATH"

      # Build the BSP using the tool
      # Using --local ensures it uses the bsp-registry.yml from the current repo (PR content)
      - script: |
          bsp --local build $(BSP_NAME)
        displayName: 'Run bsp build'

