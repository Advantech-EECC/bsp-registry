# =========================================================================
# Qualcomm registry fragment
#
# Contains the registry entries that are exclusive to the Qualcomm vendor:
# the Qualcomm vendor definition, the Qualcomm reference devices and
# their BSP presets.
#
# This file is not a stand-alone registry: it is pulled in by the top-level
# `bsp-registry.yml` through its `include:` directive and merged into it
# (lists are concatenated, so the entries below extend the corresponding
# sections of the main registry).
# =========================================================================

registry:

  # =====================================
  # Vendors
  # =====================================
  vendors:

    - slug: qualcomm
      name: "Qualcomm"
      description: "Qualcomm, wireless technology and semiconductor solutions."
      website: "https://www.qualcomm.com/"
      includes:
        - vendors/qualcomm/qualcomm-common.yml

  # =====================================
  # Devices
  # =====================================
  devices:

    # --- Qualcomm Devices ---

    - slug: qcm6490-idp
      description: "Qualcomm QCM6490 IDP Beta EVK"
