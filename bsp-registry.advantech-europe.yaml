# =========================================================================
# Advantech Europe registry fragment
#
# Contains the registry entries that are exclusive to the Advantech Europe vendor:
# the Advantech Europe vendor definition, the Advantech Europe boards
# (modular BSP) and their BSP presets.
#
# This file is not a stand-alone registry: it is pulled in by the top-level
# `bsp-registry.yml` through its `include:` directive and merged into it
# (lists are concatenated, so the entries below extend the corresponding
# sections of the main registry).
# =========================================================================

registry:

  # =====================================
  # Vendors
  # =====================================
  vendors:

    - slug: advantech-europe
      name: "Advantech Europe"
      description: "Advantech Europe, a regional branch of Advantech Corporation."
      website: "https://www.advantech.com/"
      includes:
        - vendors/advantech-europe/modular-bsp.yml

  # =====================================
  # Devices
  # =====================================
  devices:

    # --- Advantech Europe i.MX-based devices ---

    - slug: rom2620-ed91
      description: "Advantech ROM-2620 (i.MX8)"
      vendor: advantech-europe
      soc_vendor: nxp
      architecture: arm64
      includes:
        - vendors/advantech-europe/nxp/machine/imx8/rom2620-ed91.yml

    - slug: rom2820-ed93
      description: "Advantech ROM-2820 (i.MX9)"
      vendor: advantech-europe
      soc_vendor: nxp
      architecture: arm64
      includes:
        - vendors/advantech-europe/nxp/machine/imx9/rom2820-ed93.yml

    - slug: aom5521a1-db2510
      description: "Advantech AOM-5521 (i.MX95)"
