    - name: modular-bsp-rauc-rsb3720
      description: "Advantech RSB-3720 6GB (i.MX8) with RAUC support"
      device: rsb3720
      releases: [scarthgap, styhead, walnascar, whinlatter, wrynose]
      features: [systemd, security, virtualization, ipv6, usrmerge, rauc]
      build:
        path: build/modular-bsp-rauc-rsb3720
    
    - name: modular-bsp-swupdate-rsb3720
      description: "Advantech RSB-3720 6GB (i.MX8) with SWUpdate support"
      device: rsb3720
