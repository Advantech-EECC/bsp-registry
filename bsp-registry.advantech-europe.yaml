    - slug: rom5721-1g-db5901
      description: "Advantech ROM-5721 (i.MX8, 1GB)"
      vendor: advantech-europe
      soc_vendor: nxp
      architecture: arm64
      includes:
        - vendors/advantech-europe/nxp/machine/imx8/rom5721-1g-db5901.yml
    
    - slug: rom5721-2g-db5901
