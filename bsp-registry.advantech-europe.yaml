    - name: modular-bsp-rom5721-2g-db5901-secureboot
      description: "Advantech ROM-5721 DB5901 (i.MX8) with Secure Boot"
      device: rom5721-2g-db5901
      releases: [walnascar]
      features: [systemd, security, virtualization, ipv6, root-login, secure-boot]
      targets: 
        - imx-image-core-secure-boot
        - imx-image-multimedia-secure-boot
        - imx-image-full-secure-boot
      build:
        environment: "ubuntu-22.04-csb" # Use the secure boot build environment with necessary tools and keys
        path: build/modular-bsp-rom5721-2g-db5901-secureboot
    
