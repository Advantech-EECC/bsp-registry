      vendor: advantech-europe
      soc_vendor: qualcomm
      architecture: arm64
      includes:
        - vendors/advantech-europe/qualcomm/machine/aom2721.yml

  # =====================================
  # BSP Presets (named shortcuts)
  # =====================================
  bsp:

    # --- Advantech RSB-3810 (Mediatek) ---    

    - name: modular-bsp-rsb3810
      description: "Advantech RSB-3810 (Mediatek)"
      device: rsb3810
      releases: [scarthgap]
      vendor_release: mtk-rity-v25.0
      features: [systemd, security, virtualization, ipv6]
      build:
        path: build/modular-bsp-rsb3810
    
    # --- Advantech ROM-2620 (i.MX8) ---    

    - name: modular-bsp-rom2620-ed91
      description: "Advantech ROM-2620 (i.MX8)"
      device: rom2620-ed91
      releases: [scarthgap, styhead, walnascar, whinlatter, wrynose]
      features: [systemd, security, virtualization, ipv6, root-login]
      build:
        path: build/modular-bsp-rom2620-ed91
    
    # --- Advantech ROM-2820 (i.MX93) ---    

    - name: modular-bsp-rom2820-ed93
      description: "Advantech ROM-2820 (i.MX9)"
      device: rom2820-ed93
      releases: [scarthgap, styhead, walnascar, whinlatter, wrynose]
      features: [systemd, security, virtualization, ipv6, root-login]
      build:
        container: "ubuntu-22.04"
        path: build/modular-bsp-rom2820-ed93
    
    # --- Advantech Europe RSB-3720 ---

    - name: modular-ros-bsp-rsb3720
      description: "Advantech RSB-3720 (i.MX8)"
      device: rsb3720
      releases: [ros2-humble-scarthgap]
      features: [systemd, security, virtualization, ipv6, usrmerge, x11, wayland]
      targets: [ros-image-core]
      build:
        path: build/modular-ros-bsp-rsb3720
    
    - name: modular-bsp-ecu150a1
      description: "Advantech ECU-150A1 (i.MX8)"
      device: ecu150a1
      releases: [scarthgap, styhead, walnascar, whinlatter, wrynose]
      features: [systemd, security, virtualization, ipv6, usrmerge, root-login]
      build:
        path: build/modular-bsp-ecu150a1
    
    - name: modular-bsp-rsb3720
      description: "Advantech RSB-3720 (i.MX8)"
      device: rsb3720
      releases: [scarthgap, styhead, walnascar, whinlatter, wrynose]
      features: [systemd, security, virtualization, ipv6, usrmerge, root-login]
