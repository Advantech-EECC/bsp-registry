      vendor: advantech-europe
      soc_vendor: mediatek
      architecture: arm64
      includes:
        - vendors/advantech-europe/mediatek/machine/rsb3810.yaml
    
    # --- Advantech Qualcomm Devices ---
    # --- Advantech AOM2721 ---

    - slug: aom2721
