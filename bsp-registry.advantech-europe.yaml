    - name: modular-bsp-rom5721-2g-db5901
      description: "Advantech ROM-5721 DB5901 (i.MX8)"
      device: rom5721-2g-db5901
      releases: [walnascar, whinlatter, wrynose]
      features: [systemd, security, virtualization, ipv6, root-login]
