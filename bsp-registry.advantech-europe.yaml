      releases: [scarthgap, styhead, walnascar, whinlatter, wrynose]
      features: [systemd, security, virtualization, ipv6, ostree]
      build:
        path: build/modular-bsp-ostree-rsb3720
    
    # --- Advantech Europe Modular BSP ROM-5720 DB5901 ---

    - name: modular-bsp-rom5720-db5901
