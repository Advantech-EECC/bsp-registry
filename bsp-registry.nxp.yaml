specification:
  version: "2.0"

# =========================================================================
# NXP vendor registry fragment
#
# Contains the registry entries that are exclusive to the NXP vendor:
# the NXP vendor definition, the NXP reference distro, the NXP i.MX EVK
# devices and the `nxp-*` BSP presets.
#
# This file is not a stand-alone registry: it is pulled in by the top-level
# `bsp-registry.yml` through its `include:` directive and merged into it
# (lists are concatenated, so the entries below extend the corresponding
# sections of the main registry).
# =========================================================================

registry:

  # =====================================
  # Distributions
  # =====================================
  distro:

    - slug: fsl-imx-xwayland
      description: "Freescale i.MX X Wayland (Yocto Project reference distro)"
      framework: yocto
      includes:
        - vendors/nxp/distro/fsl-imx-xwayland.yaml

  # =====================================
  # Vendors
  # =====================================
  vendors:

    - slug: nxp
      name: "NXP"
      description: "NXP Semiconductors, industrial & IoT solutions."
      website: "https://www.nxp.com/"
      includes:
        - vendors/nxp/nxp.yaml

  # =====================================
  # Devices
  # =====================================
  devices:

    # --- NXP i.MX-based devices ---

    - slug: imx8ulp-evk
      description: "NXP i.MX8ULP Quad EVK"
      vendor: nxp
      soc_vendor: nxp
      architecture: arm64
      includes:
        - vendors/nxp/machine/imx8ulp-evk.yml

